[workspace]
resolver = "2"
members = [
    "client",
    "clientlib",
    "common",
    "connector",
    "console",
    "peerlib",
    "security",
    "server",
    "serverlib",
    "tlsserver",
]

[workspace.dependencies]
# Internal crates
common    = { path = "common" }
connector = { path = "connector" }
peerlib   = { path = "peerlib", default-features = false }
security  = { path = "security" }
serverlib = { path = "serverlib" }
tlsserver = { path = "tlsserver" }
clientlib = { path = "clientlib" }

# External
serde               = { version = "1.0.229", features = ["derive"] }
serde_json          = "1"
bincode             = "1.3.2"
log                 = "0.4"
env_logger          = "0.11"
chrono              = "*"
openssl             = "*"
tokio               = { version = "1", features = ["macros", "rt", "sync", "time"] }
rustls              = { version = "0.23", default-features = false, features = ["logging", "std", "tls12", "ring"] }
rustls-pemfile      = "2"
rustls-native-certs = "0.8"
tokio-rustls        = { version = "0.26", default-features = false, features = ["logging", "tls12", "ring"] }


[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(coverage,coverage_nightly)',
] }

